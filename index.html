<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>池田 悠耶 | Links</title>
<meta name="description" content="池田 悠耶のリンク集。researchmap と Ikeda Research へのリンク。">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="profilepig.jpeg">
<style>
  :root{
    color-scheme:light;
    --bg:#FFFFFF;
    --ink:#1A1D22;
    --ink-2:#4A505C;
    --ink-3:#858C99;
    --rule:#E4E6EB;
    --accent:#1F4B99;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
    font-size:16px;
    line-height:1.7;
    overflow-wrap:break-word;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  a{color:inherit;text-decoration:none}

  main{
    flex:1;
    width:100%;
    max-width:440px;
    margin:0 auto;
    padding:calc(56px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 40px calc(20px + env(safe-area-inset-left));
  }

  /* ===== プロフィール ===== */
  .hero{text-align:center;margin-bottom:32px}
  .hero img{
    width:96px;height:96px;margin:0 auto 16px;
    display:block;border-radius:50%;object-fit:cover;
    border:1px solid var(--rule);
  }
  .hero h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.04em;line-height:1.4}
  .hero .romaji{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-3);letter-spacing:.12em}
  .hero .meta{margin:12px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--ink-2);line-height:1.8}

  /* ===== リンク ===== */
  .links{margin:0;padding:0;list-style:none}
  .links li + li{margin-top:12px}
  .link{
    display:flex;align-items:center;gap:14px;
    min-height:68px;padding:14px 16px;
    border:1px solid var(--rule);border-radius:10px;
    background:var(--bg);
  }
  .link:active{background:#F6F7F9}
  .link .ico{
    width:38px;height:38px;flex:none;border-radius:8px;
    display:grid;place-items:center;color:#fff;background:var(--brand);
  }
  .link .ico svg{width:21px;height:21px}
  .link .ttl{flex:1;min-width:0;font-size:16px;font-weight:700;line-height:1.5}
  .link .sub{display:block;margin-top:1px;font-size:13.5px;font-weight:400;color:var(--ink-3)}
  .link .arw{width:16px;height:16px;flex:none;color:var(--ink-3)}

  @media (hover:hover){
    .link{transition:border-color .18s,background-color .18s}
    .link .arw{transition:transform .18s}
    .link:hover{border-color:rgba(31,75,153,.35);background:#FAFBFD}
    .link:hover .ttl{color:var(--accent)}
    .link:hover .arw{transform:translateX(3px)}
  }
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  footer{
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    text-align:center;font-size:12.5px;color:var(--ink-3);letter-spacing:.06em;
  }
</style>
</head>
<body>

<main>
  <header class="hero">
    <img src="profilepig.jpeg" alt="">
    <h1 id="name"></h1>
    <span class="romaji" id="romaji"></span>
    <ul class="meta" id="meta"></ul>
  </header>

  <ul class="links" id="links"></ul>
</main>

<footer>&copy; <span id="year"></span> <span id="footer-name"></span></footer>

<script>
/* ▼▼▼ 編集はこのブロックだけ ▼▼▼ */

const PROFILE = {
  name:   "池田 悠耶",
  romaji: "Yuya Ikeda",
  meta: [                                    // 名前の下に並ぶ行。増減は自由
    "長崎県立大学大学院 地域創生研究科",
    "情報工学専攻 博士前期課程",
  ],
};

/* 上から順にボタンとして並ぶ。icon は researchmap / link */
const LINKS = [
  {
    title: "researchmap",
    sub:   "研究業績",
    url:   "https://researchmap.jp/yuyaikeda",
    icon:  "researchmap",
    color: "#0F6E62",
  },
  {
    title: "Ikeda Research",
    sub:   "研究内容の紹介",
    url:   "https://ikeda-research.jp/",
    icon:  "link",
    color: "#1F4B99",
  },
];

/* ▲▲▲ 編集はここまで ▲▲▲ */

const ICONS = {
  researchmap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L21 21M11 7.5v7M7.5 11h7"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5a4 4 0 005.7 0l2.8-2.8a4 4 0 10-5.7-5.7l-1.4 1.4"/><path d="M13.5 10.5a4 4 0 00-5.7 0l-2.8 2.8a4 4 0 105.7 5.7l1.4-1.4"/></svg>',
};
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

document.title = `${PROFILE.name} | Links`;
$("name").textContent        = PROFILE.name;
$("romaji").textContent      = PROFILE.romaji;
$("footer-name").textContent = PROFILE.romaji;
$("year").textContent        = new Date().getFullYear();
$("meta").innerHTML = (PROFILE.meta || []).map(m => `<li>${esc(m)}</li>`).join("");

$("links").innerHTML = LINKS.filter(l => l.url).map(l => `
  <li><a class="link" style="--brand:${esc(l.color || "#1F4B99")}"
         href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">
    <span class="ico">${ICONS[l.icon] || ICONS.link}</span>
    <span class="ttl">${esc(l.title)}${l.sub ? `<span class="sub">${esc(l.sub)}</span>` : ""}</span>
    <span class="arw">${ARROW}</span>
  </a></li>`).join("");
</script>
</body>
</html>
