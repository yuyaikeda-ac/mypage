    --fs-xs:12.5px;   /* 年号・ローマ字 */

    --pad-x:20px;
    --nav-h:48px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box}

  html{
    overflow-x:clip;
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
    font-size:var(--fs-base);
    line-height:1.9;

  }
  a{color:inherit;text-decoration:none;-webkit-touch-callout:none}
  img{max-width:100%;display:block}
  button{font-family:inherit}

  .wrap{
    width:100%;max-width:560px;margin:0 auto;

    padding-right:calc(var(--pad-x) + env(safe-area-inset-right));

  .hero img{
    position:relative;
    width:118px;height:118px;border-radius:36px;
    object-fit:cover;object-position:50% 22%;

  .modal.error .pins input{border-color:#C0392B}

  .msg.info{color:var(--ink-3);font-weight:400}
  .close{
    display:block;width:100%;min-height:44px;
    border:1px solid var(--rule);border-radius:4px;background:none;
    color:var(--ink-2);font-size:var(--fs-md);font-weight:600;cursor:pointer;
  }
  .close:active{background:#F6F7F9}

  .toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:70;
    padding:9px 16px;border-radius:4px;
    background:var(--ink);color:#fff;font-size:var(--fs-sm);
    opacity:0;pointer-events:none;transition:opacity .2s;

  .toast.show{opacity:1}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .avatar::before{animation:none}
  }

  @media (max-width:360px){

  researchmap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L21 21M11 7.5v7M7.5 11h7"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5a4 4 0 005.7 0l2.8-2.8a4 4 0 10-5.7-5.7l-1.4 1.4"/><path d="M13.5 10.5a4 4 0 00-5.7 0l-2.8 2.8a4 4 0 105.7 5.7l1.4-1.4"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8.5 7.5L12 4l3.5 3.5"/><path d="M5.5 12.5V19a1 1 0 001 1h11a1 1 0 001-1v-6.5"/></svg>',
};
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
const EXT   = '<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 01-1 1H6a1 1 0 01-1-1V7a1 1 0 011-1h4"/></svg>';
const LOCK  = '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/></svg>';

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $   = id => document.getElementById(id);

/* ---------- ヘッダー ---------- */
document.title = `${PROFILE.name} | Profile`;
$("hero-name").textContent   = PROFILE.name;
$("hero-romaji").textContent = PROFILE.romaji;
$("footer-name").textContent = PROFILE.romaji;
$("footer-year").textContent = new Date().getFullYear();
document.querySelector(".hero img").src = PROFILE.photo;

$("hero-meta").innerHTML = (PROFILE.meta || [])
  .map(m => `<span class="lbl">${esc(m.label)}</span><span class="val">${esc(m.value)}</span>`).join("");

$("actions").innerHTML = `
  <a class="act" href="#links">${ICONS.link}<span>関連リンク</span></a>
  <button class="act" id="shareBtn" type="button">${ICONS.share}<span>共有</span></button>`;

/* ---------- ナビ ---------- */
$("navList").innerHTML = SECTIONS
  .map(s => `<li><a href="#${esc(s.id)}" data-nav="${esc(s.id)}">${esc(s.nav)}</a></li>`).join("");

/* ---------- 業績の件数（stats の auto: 用） ---------- */
const worksSec = SECTIONS.find(s => s.type === "works");
const countOf = label => {
  const g = worksSec && worksSec.groups.find(g => g.label === label);
  return g ? g.items.length : 0;
};

/* 業績1件分の行 */
const workRow = (w, hide) => {
  const linked = !!w.url;
  const open  = linked
    ? `<a class="row" href="${esc(w.url)}" target="_blank" rel="noopener noreferrer"`
    : `<div class="row"`;
  return `${open}${hide ? " hidden" : ""}>
      <span class="when">${esc(w.year)}</span>
      <span class="t">${esc(w.title)}</span>
      ${w.meta ? `<span class="m">${esc(w.meta)}</span>` : ""}
      ${linked ? EXT : ""}
    ${linked ? "</a>" : "</div>"}`;
};

/* ---------- 各セクションの描画 ---------- */
const RENDER = {
  about: s => `
    <div class="about">
      ${s.body.map(p => `<p>${esc(p)}</p>`).join("")}
      ${s.stats && s.stats.length ? `<div class="stats">${s.stats.map(st => {
        const v = String(st.value).startsWith("auto:")
          ? countOf(String(st.value).slice(5))
          : st.value;
        return `<div class="stat"><span>${esc(st.label)}</span><b>${esc(v)}</b></div>`;
      }).join("")}</div>` : ""}
    </div>`,

  research: s => `
    <p class="kw">${s.keywords.map(k => `<span>${esc(k)}</span>`).join("")}</p>
    ${s.fields && s.fields.length ? `<div class="fields">${s.fields.map(f => `
      <div class="field"><b>${esc(f.title)}</b><p>${esc(f.desc)}</p></div>`).join("")}</div>` : ""}`,

  career: s => `
    <ul class="list">${s.items.map(i => `
      <li class="row">
        <span class="when">${esc(i.period)}</span>
        <span class="t">${esc(i.title)}</span>
        <span class="s">${esc(i.org)}</span>
        ${i.note ? `<span class="m">${esc(i.note)}</span>` : ""}
      </li>`).join("")}
    </ul>`,

  works: s => s.groups.map((g, gi) => `
    <div class="grp">
      <h3>${esc(g.label)}</h3>
      <div data-grp="${gi}">
        ${g.items.length
          ? g.items.map((w, wi) => workRow(w, wi >= 4)).join("")
          : `<div class="row empty">${esc(g.none || "なし")}</div>`}
      </div>
      ${g.items.length > 4
        ? `<button class="more" type="button" data-more="${gi}">すべて表示（残り ${g.items.length - 4} 件）</button>`
        : ""}
    </div>`).join(""),

  links: () => `
    <ul class="links">${LINKS.map((l, i) => {
      const ext  = /^https?:/i.test(l.url || "");
      const attr = l.enc
        ? `href="#" data-pin="${i}"`
        : `href="${esc(l.url)}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ""}`;
      return `
      <li><a class="link" style="--brand:${esc(l.color || "#1F4B99")}" ${attr}>
        <span class="ico">${ICONS[l.icon] || ICONS.link}</span>
        <span class="ttl">${esc(l.title)}${l.sub ? `<span class="sub">${esc(l.sub)}</span>` : ""}</span>
        ${l.enc ? LOCK : ""}
        <span class="arw">${ARROW}</span>
      </a></li>`;
    }).join("")}</ul>`,
};

$("main").innerHTML = SECTIONS.map(s => `
  <section id="${esc(s.id)}">
    <h2>${esc(s.title)}</h2>
    ${(RENDER[s.type] || (() => ""))(s)}
  </section>`).join("");

/* 「すべて表示」 */
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-more]");
  if (!btn) return;
  btn.parentElement.querySelectorAll(".row[hidden]").forEach(el => el.removeAttribute("hidden"));
  btn.remove();
});

/* ---------- ナビの現在地 ---------- */
const navLinks = [...document.querySelectorAll("[data-nav]")];
const secs = SECTIONS.map(s => $(s.id)).filter(Boolean);

let ticking = false;
function onScroll(){
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const line = window.scrollY + window.innerHeight * .3;
    let active = secs[0];
    secs.forEach(sec => { if (sec.offsetTop <= line) active = sec; });
    navLinks.forEach(a => a.classList.toggle("active", active && a.dataset.nav === active.id));
    ticking = false;
  });
}
window.addEventListener("scroll", onScroll, { passive: true });
window.addEventListener("resize", onScroll, { passive: true });
onScroll();

/* ナビをタップしたら、その項目を横スクロール内で見える位置へ */
navLinks.forEach(a => a.addEventListener("click", () => {
  a.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
}));

/* ---------- 共有 ---------- */
const toast = $("toast");
let toastTimer;
function showToast(text){
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1900);
}
$("shareBtn").addEventListener("click", async () => {
  const data = { title: `${PROFILE.name} | Profile`, url: location.href };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(location.href);
    showToast("リンクをコピーしました");
  } catch (err) {
    if (err && err.name === "AbortError") return;      // 共有シートを閉じただけ
    showToast("コピーできませんでした");
  }
});

/* ============================================================================
   PIN で保護されたリンク
   URL は AES-256-GCM で暗号化してあり、正しい PIN のときだけ復号されます。
   ============================================================================ */
const modal = $("modal"), pinsEl = $("pins"), msgEl = $("msg");
let current = null, lastFocus = null;

function setMsg(text, isError){
  msgEl.textContent = text || " ";
  msgEl.classList.toggle("info", !isError);
  modal.classList.toggle("error", !!isError);
}

function buildPins(len){
  pinsEl.innerHTML = Array.from({ length: len }, () =>
    '<input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code">'
  ).join("");
  const inputs = [...pinsEl.querySelectorAll("input")];

  inputs.forEach((el, i) => {
    el.addEventListener("input", () => {
      /* iOS の自動入力などで複数桁まとめて入ることがあるので分配する */
      const digits = el.value.replace(/\D/g, "");
      if (digits.length > 1) {
        digits.split("").forEach((d, k) => {
          if (inputs[i + k]) { inputs[i + k].value = d; inputs[i + k].classList.add("filled"); }
        });
        const next = Math.min(i + digits.length, inputs.length - 1);
        inputs[next].focus();
      } else {
        el.value = digits;
        el.classList.toggle("filled", !!digits);
        if (digits && i < inputs.length - 1) inputs[i + 1].focus();
      }
      modal.classList.remove("error");
      if (inputs.every(x => x.value)) submit(inputs.map(x => x.value).join(""));
    });
    el.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !el.value && i > 0) {
        e.preventDefault();
        inputs[i - 1].value = "";
        inputs[i - 1].classList.remove("filled");
        inputs[i - 1].focus();
      }
    });
  });
  return inputs;
}

function openModal(item){
  current = item;
  lastFocus = document.activeElement;
  $("modalDesc").textContent =
    item.desc || `名刺の右下に記載されている ${item.pin || 4} 桁を入力してください`;
  setMsg("", false);
  const inputs = buildPins(item.pin || 4);
  modal.classList.add("open");
  setTimeout(() => inputs[0].focus(), 60);
}

function closeModal(){
  modal.classList.remove("open", "error");
  current = null;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

async function decrypt(b64, pin){
  const raw  = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16);
  const iv   = raw.slice(16, 28);
  const data = raw.slice(28);
  const km   = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key  = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt   = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
  return new TextDecoder().decode(pt);
}

async function submit(pin){
  if (!current) return;
  if (!window.crypto || !crypto.subtle) {
    setMsg("この環境では利用できません（https でお試しください）", true);
    return;
  }
  setMsg("確認中…", false);
  try {
    const url = await decrypt(current.enc, pin);
    setMsg("認証しました。移動します…", false);
    location.href = url;
  } catch {
    setMsg("PINコードが違います", true);
    const inputs = [...pinsEl.querySelectorAll("input")];
    inputs.forEach(x => { x.value = ""; x.classList.remove("filled"); });
    inputs[0].focus();
  }
}

document.addEventListener("click", e => {
  const a = e.target.closest("a[data-pin]");
  if (!a) return;
  e.preventDefault();
  openModal(LINKS[Number(a.dataset.pin)]);
});
$("close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
});
</script>
