<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Links</title>
<meta name="description" content="観光 × データ分析 × AI × システム開発。研究・活動のリンク集とお問い合わせはこちらから。">
<meta name="theme-color" content="#F4F7FC">
<style>
  :root{
    color-scheme:light;
    --bg:#F4F7FC;
    --surface:#FFFFFF;
    --ink:#111827;
    --ink-2:#4B5563;
    --ink-3:#8A93A3;
    --line:#EDF0F5;

    --blue:#3182F6;   /* メイン */
    --mint:#00C7B1;
    --coral:#FF6B6B;
    --gold:#FFB020;
    --violet:#7C6BFF;

    --r-lg:28px;
    --r-md:20px;
    --shadow-sm:0 2px 8px rgba(17,24,39,.05);
    --shadow-md:0 10px 30px -12px rgba(17,24,39,.16);
    --shadow-lg:0 26px 60px -24px rgba(17,24,39,.26);
  }
  *{box-sizing:border-box}

  /* ===== 画面を固定（スクロールなし・アドレスバーの伸縮でもズレない） ===== */
  html,body{
    margin:0;padding:0;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    position:fixed;inset:0;          /* iOS のバウンス／引っ張り更新を無効化 */
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
    line-height:1.7;
    letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;   /* 横向き時に文字が勝手に拡大されるのを防止 */
    -webkit-tap-highlight-color:transparent;
    display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none;-webkit-touch-callout:none}

  /* ===== 背景：やわらかいパステルのブロブ ===== */
  .blob{position:fixed;z-index:0;pointer-events:none;filter:blur(70px);border-radius:50%}
  .blob.a{top:-120px;left:-90px;width:420px;height:420px;background:rgba(49,130,246,.20)}
  .blob.b{top:8%;right:-140px;width:400px;height:400px;background:rgba(0,199,177,.18)}
  .blob.c{bottom:-180px;left:20%;width:460px;height:460px;background:rgba(255,176,32,.16)}
  .blob.d{bottom:12%;right:8%;width:300px;height:300px;background:rgba(124,107,255,.14)}

  main{
    position:relative;z-index:1;flex:1;min-height:0;
    width:100%;max-width:430px;margin:0 auto;
    /* ノッチ／ホームバーを避ける */
    padding:
      calc(28px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(28px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
    display:flex;flex-direction:column;justify-content:center;
    /* リンクが増えて画面に収まらないときだけ、ここが内部スクロールする */
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }

  /* ===== 見出し ===== */
  .head{text-align:center;margin:0 0 24px;flex:none}
  .head .en{
    display:block;font-size:11px;font-weight:800;letter-spacing:.16em;
    color:var(--blue);margin-bottom:6px;
  }
  .head h1{
    font-size:clamp(24px,7vw,29px);line-height:1.35;margin:0 0 8px;
    font-weight:800;letter-spacing:-.035em;
  }
  .head p{margin:0;font-size:13px;color:var(--ink-3);font-weight:500;line-height:1.6}

  /* ===== 誘導ボタン ===== */
  .links{display:flex;flex-direction:column;gap:14px}
  .btn{
    position:relative;display:flex;align-items:center;gap:16px;
    background:var(--surface);
    border-radius:var(--r-md);
    box-shadow:var(--shadow-md);
    padding:19px 22px;
    transition:transform .24s cubic-bezier(.2,.8,.3,1),box-shadow .24s;
  }
  .btn:hover,.btn:focus-visible{
    transform:translateY(-4px);
    box-shadow:0 26px 46px -20px color-mix(in srgb,var(--accent) 55%,rgba(17,24,39,.3));
    outline:none;
  }
  .btn:active{transform:translateY(-1px)}

  .btn .ico{
    width:52px;height:52px;flex:none;border-radius:17px;
    display:grid;place-items:center;color:#fff;
    background:var(--accent);
    box-shadow:0 10px 20px -10px color-mix(in srgb,var(--accent) 85%,transparent);
  }
  .btn .ico svg{width:26px;height:26px}
  .btn .ttl{flex:1;min-width:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
  .btn .arw{
    width:30px;height:30px;flex:none;border-radius:50%;
    display:grid;place-items:center;background:#F3F5F9;color:var(--ink-3);
    transition:background .24s,color .24s,transform .24s;
  }
  .btn .arw svg{width:15px;height:15px}
  .btn:hover .arw{background:var(--accent);color:#fff;transform:translateX(3px)}
  /* 鍵つきリンク（PIN が必要） */
  .btn .lock{width:16px;height:16px;flex:none;color:var(--ink-3);margin-right:-4px}

  /* ===== PIN 入力モーダル ===== */
  .modal{
    position:fixed;inset:0;z-index:50;
    display:none;place-items:center;
    padding:20px;
    background:rgba(17,24,39,.42);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .modal.open{display:grid;animation:fade .2s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .sheet{
    width:100%;max-width:340px;
    background:var(--surface);
    border-radius:26px;
    box-shadow:0 30px 70px -20px rgba(17,24,39,.45);
    padding:30px 24px 22px;
    text-align:center;
    animation:pop .28s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

  .sheet .badge{
    width:54px;height:54px;margin:0 auto 16px;border-radius:18px;
    display:grid;place-items:center;color:#fff;background:var(--line-green,#06C755);
    box-shadow:0 12px 24px -12px rgba(6,199,85,.9);
  }
  .sheet .badge svg{width:26px;height:26px}
  .sheet h2{font-size:19px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
  .sheet .desc{font-size:13px;color:var(--ink-3);margin:0 0 22px;line-height:1.6}

  .pins{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
  .pins input{
    width:52px;height:60px;
    border:2px solid #E5E9F0;border-radius:16px;
    background:#F7F9FC;
    font-size:24px;font-weight:800;text-align:center;color:var(--ink);
    font-family:inherit;
    transition:border-color .18s,background .18s,transform .18s;
    -moz-appearance:textfield;appearance:textfield;
  }
  .pins input::-webkit-outer-spin-button,.pins input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .pins input:focus{outline:none;border-color:var(--blue);background:#fff}
  .pins input.filled{border-color:var(--blue);background:#fff}
  .modal.error .pins{animation:shake .38s}
  .modal.error .pins input{border-color:var(--coral);background:#FFF5F5}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
    60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
  }

  .msg{font-size:12.5px;min-height:20px;margin:0 0 14px;color:var(--coral);font-weight:600}
  .msg.info{color:var(--ink-3);font-weight:500}
  .close{
    display:block;width:100%;padding:13px;border:0;border-radius:14px;
    background:#F3F5F9;color:var(--ink-2);
    font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
    transition:background .18s;
  }
  .close:hover{background:#E9EDF4}

  /* 出現アニメーション */
  .reveal{opacity:0;transform:translateY(18px);animation:rise .8s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .reveal{animation:none;opacity:1;transform:none}
  }
  @media (max-width:420px){
    main{padding:32px 16px}
    .head h1{font-size:26px}
    .btn{padding:17px 18px;gap:14px}
    .btn .ico{width:48px;height:48px;border-radius:15px}
    .pins input{width:48px;height:56px;font-size:22px}
  }
</style>
</head>
<body>

<div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div class="blob d"></div>

<main>
  <header class="head reveal">
    <span class="en">LINKS</span>
    <h1>リンク一覧</h1>
    <p>リンクから研究・活動をご覧いただけます</p>
  </header>
  <div class="links" id="links"></div>
</main>

<!-- PIN 入力モーダル -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet">
    <div class="badge" id="modalBadge"></div>
    <h2 id="modalTitle">PINコードを入力</h2>
    <p class="desc" id="modalDesc">お伝えしたPINコードを入力してください</p>
    <div class="pins" id="pins"></div>
    <p class="msg info" id="msg">&nbsp;</p>
    <button class="close" id="close" type="button">閉じる</button>
  </div>
</div>

<script>
/* ============================================================
   ▼▼▼ 編集はここだけ ▼▼▼
   url に実際のリンクを入れてください。
   増やすときは { ... }, のブロックをコピペするだけ（個数制限なし）。
   icon は "linkedin" / "line" / "mail" / "x" / "github" / "note" / "link" から選択。
   ============================================================ */
const LINKS = [
  {
    title: "LinkedIn",
    url:   "https://www.linkedin.com/in/yuyaikeda02/",
    icon:  "linkedin",
    color: "#0A66C2",
  },
  {
    title: "LINE",
    icon:  "line",
    color: "#06C755",
    // ▼ PIN で保護されたリンク。url ではなく enc（暗号文）を持たせる。
    //    PIN や URL を変えるときは、同じフォルダの pin-tool.html を開いて
    //    新しい暗号文を作り、下の enc: "..." を置き換えてください。
    pin:   4,                        // PIN の桁数
    enc:   "p+htg0aSvU6jNmxJwZxy9EVlqE9WKiglaS/aeGkZbLt+Ln74ZLUsCRFFSVW1lckwpNm+AwAKAccQq2iXacRPcsIXFfGGPwJCrybn",
  },
  // {
  //   title: "お問い合わせ",
  //   url:   "mailto:you@example.com",
  //   icon:  "mail",
  //   color: "#FF6B6B",
  // },
];
/* ▲▲▲ 編集はここまで ▲▲▲ */


/* ---- アイコン定義 ---- */
const ICONS = {
  linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 110-4.13 2.07 2.07 0 010 4.13zM7.12 20.45H3.55V9h3.57v11.45z"/></svg>',
  line:     '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3.2c-4.97 0-9 3.27-9 7.3 0 3.6 3.2 6.63 7.52 7.2.29.06.69.19.79.44.09.22.06.58.03.81 0 0-.1.63-.13.77-.04.23-.18.9.79.49s5.26-3.1 7.18-5.31C20.5 13.4 21 12 21 10.5c0-4.03-4.03-7.3-9-7.3z"/><text x="12" y="12.8" text-anchor="middle" font-size="5.4" font-weight="800" letter-spacing=".2" fill="var(--accent)" font-family="Arial,Helvetica,sans-serif">LINE</text></svg>',
  mail:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>',
  x:        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16M20 4L4 20"/></svg>',
  github:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4 1.3-4-2.2-5.5-2.7M15 21v-3.4c0-1 .1-1.4-.5-2 2.4-.3 4.5-1.2 4.5-5.1 0-1.1-.4-2-1-2.7.1-.3.4-1.4-.1-2.8 0 0-.9-.3-3 1.1a10 10 0 00-5.3 0C7.5 3.7 6.6 4 6.6 4c-.5 1.4-.2 2.5-.1 2.8-.6.7-1 1.6-1 2.7 0 3.9 2.1 4.8 4.5 5.1-.4.4-.5.9-.5 1.5V21"/></svg>',
  note:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h9l5 5v11a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M14 4v5h5M8 13h7M8 17h5"/></svg>',
  link:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5a4 4 0 005.7 0l2.8-2.8a4 4 0 10-5.7-5.7l-1.4 1.4"/><path d="M13.5 10.5a4 4 0 00-5.7 0l-2.8 2.8a4 4 0 105.7 5.7l1.4-1.4"/></svg>',
};
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const LOCK = '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V7.5a4 4 0 018 0v3"/></svg>';

/* ---- ボタン描画 ---- */
document.getElementById("links").innerHTML = LINKS.map((l, i) => {
  const ext = /^https?:/i.test(l.url || "");
  const attr = l.enc
    ? `href="#" data-pin="${i}"`
    : `href="${esc(l.url)}" ${ext ? 'target="_blank" rel="noopener noreferrer"' : ""}`;
  return `
  <a class="btn reveal"
     style="--accent:${esc(l.color || "#3182F6")};animation-delay:${(0.16 + i * 0.08).toFixed(2)}s"
     ${attr}>
    <span class="ico">${ICONS[l.icon] || ICONS.link}</span>
    <span class="ttl">${esc(l.title)}</span>
    ${l.enc ? LOCK : ""}
    <span class="arw">${ARROW}</span>
  </a>`;
}).join("");


/* ============================================================
   PIN で保護されたリンク
   URL は AES-GCM で暗号化してあり、正しい PIN を入れたときだけ
   復号されます（ページのソースを見ても URL は分かりません）。
   ============================================================ */
const modal  = document.getElementById("modal");
const pinsEl = document.getElementById("pins");
const msgEl  = document.getElementById("msg");
let current  = null;   // 開いている LINKS の要素

function setMsg(text, isError) {
  msgEl.textContent = text || " ";
  msgEl.classList.toggle("info", !isError);
  modal.classList.toggle("error", !!isError);
}

function buildPins(len) {
  pinsEl.innerHTML = Array.from({ length: len }, () =>
    '<input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off">'
  ).join("");
  const inputs = [...pinsEl.querySelectorAll("input")];

  inputs.forEach((el, i) => {
    el.addEventListener("input", () => {
      el.value = el.value.replace(/\D/g, "").slice(-1);
      el.classList.toggle("filled", !!el.value);
      modal.classList.remove("error");
      if (el.value && i < inputs.length - 1) inputs[i + 1].focus();
      if (inputs.every(x => x.value)) submit(inputs.map(x => x.value).join(""));
    });
    el.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !el.value && i > 0) {
        e.preventDefault();
        inputs[i - 1].value = "";
        inputs[i - 1].classList.remove("filled");
        inputs[i - 1].focus();
      }
    });
  });
  return inputs;
}

function openModal(item) {
  current = item;
  document.getElementById("modalBadge").innerHTML = ICONS[item.icon] || ICONS.link;
  document.getElementById("modalBadge").style.background = item.color || "#3182F6";
  document.getElementById("modalTitle").textContent = "PINコードを入力";
  document.getElementById("modalDesc").textContent =
    `${item.title} を開くには ${item.pin} 桁のPINコードが必要です`;
  setMsg("", false);
  const inputs = buildPins(item.pin || 4);
  modal.classList.add("open");
  setTimeout(() => inputs[0].focus(), 60);
}

function closeModal() {
  modal.classList.remove("open", "error");
  current = null;
}

async function decrypt(b64, pin) {
  const raw  = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16);
  const iv   = raw.slice(16, 28);
  const data = raw.slice(28);
  const km   = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key  = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt   = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
  return new TextDecoder().decode(pt);
}

async function submit(pin) {
  if (!current) return;
  if (!window.crypto || !crypto.subtle) {
    setMsg("この環境では利用できません（https でお試しください）", true);
    return;
  }
  setMsg("確認中…", false);
  try {
    const url = await decrypt(current.enc, pin);
    setMsg("認証しました。移動します…", false);
    location.href = url;
  } catch {
    setMsg("PINコードが違います", true);
    const inputs = [...pinsEl.querySelectorAll("input")];
    inputs.forEach(x => { x.value = ""; x.classList.remove("filled"); });
    inputs[0].focus();
  }
}

document.getElementById("links").addEventListener("click", e => {
  const a = e.target.closest("a[data-pin]");
  if (!a) return;
  e.preventDefault();
  openModal(LINKS[Number(a.dataset.pin)]);
});
document.getElementById("close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
});
</script>
</body>
</html>
